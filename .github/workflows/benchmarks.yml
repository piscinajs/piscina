# Inspired on: https://github.com/fastify/fastify/blob/main/.github/workflows/benchmark.yml

name: Benchmark
on:
  pull_request:
    types:
      - labeled

jobs:
  benchmark-pr:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: >
      (
        github.event.action == 'labeled'
          && contains(github.event.label.name, 'benchmarks')
      )
    name: Benchmark Pull Request
    outputs:
      PR-BENCH-22: ${{ steps.benchmark-pr-run.outputs.BENCH_RESULT22 }}
      PR-BENCH-24: ${{ steps.benchmark-pr-run.outputs.BENCH_RESULT24 }}
      PR-BENCH-26: ${{ steps.benchmark-pr-run.outputs.BENCH_RESULT26 }}
    strategy:
      fail-fast: true
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{github.event.pull_request.head.sha}}
          repository: ${{github.event.pull_request.head.repo.full_name}}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: package.json

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Benchmark Branch
        id: benchmark-pr-run
        run: |
          npm run --silent --if-present benchmark:ci > result.txt
          result=$(cat result.txt)
          echo 'BENCH_RESULT${{matrix.node-version}}<<EOF' >> $GITHUB_OUTPUT
          echo "$result" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  benchmark-current:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [benchmark-pr]
    name: Benchmark Current Version
    outputs:
      CURRENT-BENCH-22: ${{ steps.benchmark-current-run.outputs.BENCH_RESULT22 }}
      CURRENT-BENCH-24: ${{ steps.benchmark-current-run.outputs.BENCH_RESULT24 }}
      CURRENT-BENCH-26: ${{ steps.benchmark-current-run.outputs.BENCH_RESULT26 }}
    strategy:
      fail-fast: true
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: "current"

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: package.json

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Benchmark Current
        id: benchmark-current-run
        run: |
          npm run --silent --if-present benchmark:ci > result.txt
          result=$(cat result.txt)
          echo 'BENCH_RESULT${{matrix.node-version}}<<EOF' >> $GITHUB_OUTPUT
          echo "$result" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  print-benchmark:
    needs:
      - benchmark-pr
      - benchmark-current
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Comment PR
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          message: |
            ### Benchmarks Results

            >Numbers are in Ops/sec

            **Node**: 22
            **PR**:
              ```shell
              ${{ needs.benchmark-pr.outputs.PR-BENCH-22 }}
              ```

            **MAIN**:
              ```shell
              ${{ needs.benchmark-current.outputs.CURRENT-BENCH-22 }}
              ```

            ---

            **Node**: 24
            **PR**:
              ```shell
              ${{ needs.benchmark-pr.outputs.PR-BENCH-24 }}
              ```

            **MAIN**:
              ```shell
              ${{ needs.benchmark-current.outputs.CURRENT-BENCH-24 }}
              ```

            ---

            **Node**: 26
            **PR**:
              ```shell
              ${{ needs.benchmark-pr.outputs.PR-BENCH-26 }}
              ```

            **MAIN**:
              ```shell
              ${{ needs.benchmark-current.outputs.CURRENT-BENCH-26 }}
              ```

  remove-label:
    if: ${{ github.event.label.name == 'benchmarks' }}
    needs:
      - print-benchmark
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove benchmark label
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
        id: remove-label
        with:
          route: DELETE /repos/{repo}/issues/{issue_number}/labels/{name}
          repo: ${{ github.repository }}
          issue_number: ${{ github.event.pull_request.number }}
          name: benchmarks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
